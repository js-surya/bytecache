name: Release

# Features are merged into `develop`, tested and built on a Mac first (scripts/test.sh); GitHub doesn't
# build the apps (its Mac runners lag behind new Xcode releases). A release is one pull request from
# `develop` into `main`: merging it (a regular merge, not squash) publishes a release if the version
# and build in project.yml are new: the source code and notes listing every change since the previous
# release. The apps themselves are distributed only through TestFlight and the App Store, so the
# release has no app files. Change the version with scripts/set-version.sh X.Y.Z [BUILD].
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          version=$(scripts/version.sh)
          build=$(scripts/version.sh --build)
          # A release is a version and build, "ByteCache 1.3.0 (7)". The first release of a version is
          # tagged vX.Y.Z; later builds of the same version (TestFlight keeps the version) vX.Y.Z-BUILD.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tag="v$version-$build"
          else
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$version ($build) is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "$version ($build) is not released yet: $tag."
          fi

      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<NOTES
          ## Install
          Get ByteCache for iPhone, iPad and Mac from the **[TestFlight beta](https://testflight.apple.com/join/rpmeVJW6)**: open the link on your device and follow the steps.

          Requires iOS / iPadOS 17 or macOS 14 or later, and a [ByteStash](https://github.com/jordan-dalby/ByteStash) server (or the public demo).
          NOTES
          # Every change since the previous release (features land on develop, so pull-request-based
          # notes would miss them). Housekeeping commits (chore/ci/docs/test, version bumps) are left out.
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo
            echo "## What's changed"
            git log --no-merges --format='%s' ${previous:+$previous..}HEAD \
              | grep -vE '^(chore|ci|docs|test)(\(|:)' \
              | grep -vE '^Release [0-9]' \
              | perl -pe 's/^[a-z]+(\([^)]*\))?!?: //; s/^([a-z])(?=[a-z]*(?:[^A-Za-z]|$))/\u$1/; s/^/- /'
          } >> notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "ByteCache $VERSION ($BUILD)" \
            --notes-file notes.md
