name: ByteCache
options:
  bundleIdPrefix: me.suryajs
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "6.0"
    BC_APP_GROUP_ID: group.me.suryajs.bytecache
    BC_APP_GROUP_ID[sdk=macosx*]: $(TeamIdentifierPrefix)me.suryajs.bytecache
packages:
  ByteCacheKit:
    path: Packages/ByteCacheKit
targets:
  ByteCache:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheCore
      - package: ByteCacheKit
        product: ByteCacheLanguage
      - package: ByteCacheKit
        product: ByteCacheFeatures
      - target: Widgets
      - target: ShareExtension-iOS
        destinationFilters: [iOS]
      - target: ShareExtension-macOS
        destinationFilters: [macOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ByteCache
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSUserActivityTypes: [me.suryajs.bytecache.snippet]
        CFBundleURLTypes:
          - CFBundleURLName: me.suryajs.bytecache
            CFBundleURLSchemes: [bytecache]
        NSCameraUsageDescription: ByteCache uses the camera to scan code so you can save it as a snippet.
        NSFaceIDUsageDescription: ByteCache uses Face ID to keep your snippets private when App Lock is on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ByteCache connects to the ByteStash server you enter, which may be on your local network.
        BCAppGroupID: $(BC_APP_GROUP_ID)
        BCKeychainGroup: $(AppIdentifierPrefix)me.suryajs.bytecache.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.bytecache
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings → Appearance → App Icon (generated by design/AppIcon/make-app-icons.py)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Black AppIcon-Midnight AppIcon-Mint AppIcon-Grape AppIcon-Sunset AppIcon-Graphite AppIcon-Light
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resources/ByteCache-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/ByteCache-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SUPPORTS_MACCATALYST: NO
  Widgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources: [Widgets, Shared]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheCore
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ByteCache
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BCAppGroupID: $(BC_APP_GROUP_ID)
        BCKeychainGroup: $(AppIdentifierPrefix)me.suryajs.bytecache.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.bytecache.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Widgets/Widgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources: [ShareExtension-iOS]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.bytecache.share
        INFOPLIST_FILE: ShareExtension-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-iOS/ShareExtension-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources: [ShareExtension-macOS]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.bytecache.sharemac
        INFOPLIST_FILE: ShareExtension-macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-macOS/ShareExtension-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  ByteCacheUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: ByteCache
    settings:
      base:
        TEST_TARGET_NAME: ByteCache
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: me.suryajs.bytecache.uitests
schemes:
  ByteCache-UITests:
    build:
      targets:
        ByteCache: all
        ByteCacheUITests: [test]
    test:
      targets:
        - ByteCacheUITests
  ByteCache:
    build:
      targets:
        ByteCache: all
    test:
      targets:
        - package: ByteCacheKit/ByteCacheCoreTests
        - package: ByteCacheKit/ByteCacheLanguageTests
        - package: ByteCacheKit/ByteCacheFeaturesTests
