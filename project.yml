name: ByteCatch
options:
  bundleIdPrefix: app.bytecatch
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    BC_APP_GROUP_ID: group.app.bytecatch
    BC_APP_GROUP_ID[sdk=macosx*]: $(TeamIdentifierPrefix)app.bytecatch
packages:
  ByteCatchKit:
    path: Packages/ByteCatchKit
targets:
  ByteCatch:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: ByteCatchKit
        product: ByteCatchCore
      - package: ByteCatchKit
        product: ByteCatchLanguage
      - package: ByteCatchKit
        product: ByteCatchFeatures
      - target: ShareExtension-iOS
        destinationFilters: [iOS]
      - target: ShareExtension-macOS
        destinationFilters: [macOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ByteCatch
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        BCAppGroupID: $(BC_APP_GROUP_ID)
        BCKeychainGroup: $(AppIdentifierPrefix)app.bytecatch.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecatch.ByteCatch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resources/ByteCatch-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/ByteCatch-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SUPPORTS_MACCATALYST: NO
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources: [ShareExtension-iOS]
    dependencies:
      - package: ByteCatchKit
        product: ByteCatchFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecatch.ByteCatch.Share
        INFOPLIST_FILE: ShareExtension-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-iOS/ShareExtension-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources: [ShareExtension-macOS]
    dependencies:
      - package: ByteCatchKit
        product: ByteCatchFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecatch.ByteCatch.ShareMac
        INFOPLIST_FILE: ShareExtension-macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-macOS/ShareExtension-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  ByteCatch:
    build:
      targets:
        ByteCatch: all
    test:
      targets:
        - package: ByteCatchKit/ByteCatchCoreTests
        - package: ByteCatchKit/ByteCatchLanguageTests
        - package: ByteCatchKit/ByteCatchFeaturesTests
