name: ByteCache
options:
  bundleIdPrefix: app.bytecache
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.1.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    BC_APP_GROUP_ID: group.app.bytecache
    BC_APP_GROUP_ID[sdk=macosx*]: $(TeamIdentifierPrefix)app.bytecache
packages:
  ByteCacheKit:
    path: Packages/ByteCacheKit
targets:
  ByteCache:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheCore
      - package: ByteCacheKit
        product: ByteCacheLanguage
      - package: ByteCacheKit
        product: ByteCacheFeatures
      - target: Widgets
      - target: ShareExtension-iOS
        destinationFilters: [iOS]
      - target: ShareExtension-macOS
        destinationFilters: [macOS]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ByteCache
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSUserActivityTypes: [app.bytecache.ByteCache.snippet]
        CFBundleURLTypes:
          - CFBundleURLName: app.bytecache.ByteCache
            CFBundleURLSchemes: [bytecache]
        NSCameraUsageDescription: ByteCache uses the camera to scan code so you can save it as a snippet.
        NSFaceIDUsageDescription: ByteCache uses Face ID to keep your snippets private when App Lock is on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: ByteCache connects to the ByteStash server you enter, which may be on your local network.
        BCAppGroupID: $(BC_APP_GROUP_ID)
        BCKeychainGroup: $(AppIdentifierPrefix)app.bytecache.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecache.ByteCache
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Resources/ByteCache-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/ByteCache-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SUPPORTS_MACCATALYST: NO
  Widgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources: [Widgets, Shared]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheCore
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: ByteCache
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        BCAppGroupID: $(BC_APP_GROUP_ID)
        BCKeychainGroup: $(AppIdentifierPrefix)app.bytecache.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecache.ByteCache.Widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Widgets/Widgets-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
  ShareExtension-iOS:
    type: app-extension
    platform: iOS
    sources: [ShareExtension-iOS]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecache.ByteCache.Share
        INFOPLIST_FILE: ShareExtension-iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-iOS/ShareExtension-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
  ShareExtension-macOS:
    type: app-extension
    platform: macOS
    sources: [ShareExtension-macOS]
    dependencies:
      - package: ByteCacheKit
        product: ByteCacheFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bytecache.ByteCache.ShareMac
        INFOPLIST_FILE: ShareExtension-macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension-macOS/ShareExtension-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  ByteCache:
    build:
      targets:
        ByteCache: all
    test:
      targets:
        - package: ByteCacheKit/ByteCacheCoreTests
        - package: ByteCacheKit/ByteCacheLanguageTests
        - package: ByteCacheKit/ByteCacheFeaturesTests
